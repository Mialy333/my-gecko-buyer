[project]
name = "my-gecko-buyer"
version = "0.1.0"
description = "A buyer agent that pays on Solana devnet through Gecko, or says which field stopped it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # Transactions, keys and addresses. The only place a key is read is buyer/signer.py.
  "solders>=0.21",
  # Only for project 03, where you serve your own check as an MCP server. The buyer's
  # own MCP client (buyer/mcp_client.py) is stdlib, so you can read every line of it.
  "mcp>=2",
]

[project.scripts]
buyer = "buyer.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["buyer"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# Kept from the earlier template as they were; not part of the buyer.
extend-exclude = ["workflows", "projects/01-read-the-menu", "demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# agent.py imports what the step bodies need before you write them. Without this,
# `ruff check --fix` would delete those imports while they are still unused.
"buyer/agent.py" = ["F401"]
